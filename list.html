<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/jspdf-autotable@5.0.2/dist/jspdf.plugin.autotable.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container-fluid" style="padding-top: 15px;">
        <div class="row">
            <div class="col-md-2">
                <button type="button" class="btn btn-primary left-align-button" onclick="goToLink('create')">Create</button>
                <br>
                <br>
                <button type="button" class="btn btn-primary left-align-button" onclick="goToLink('index')" style="width:90%;max-width: 128px;">Inventory</button>

                <br>
                <br>
            </div>

            <div class="col-md-10 rounded-background">
                <br>
                <button type="button" class="btn btn-primary" onclick="exportToPDF()">Create PDF summary</button>
            </div>
        </div>
    </div>
    <script>

        function goToLink(input){
            window.location.replace(input+".html");
        }

        let database = JSON.parse(localStorage.getItem("2027_EMR"))
        function exportToPDF() {
            const { jsPDF } = window.jspdf
            const doc = new jsPDF()
            autoTable(doc, {
                head: [['Name', 'Inventory', 'Expiration Date']],
                body: database.batches.map((batch) => {return [batch.name, batch.start+batch.added-batch.consumed, batch.expiryA]})
            })
            let dateNow = new Date().toJSON().slice(0, 10)
            doc.save(`Inventory Report (${dateNow}).pdf`)
        }            

    </script>
</body>
</html>
