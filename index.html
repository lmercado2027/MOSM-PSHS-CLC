<!DOCTYPE html>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-md bg-light navbar-light">
        <a class="navbar-brand" href="index.html"><img src="img/logo.png" width=100px height=auto></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Inventory</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="create.html">Create</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="list.html">Export</a>
            </li>
            </ul>
        </div>
    </nav>

    <div class="container-fluid" style="padding-top: 15px;">
        <div class="row">

            <div class="col-md-12 rounded-background">
                    <h1 id="mainheadingtext" style="display:inline;">Inventory</h1>&nbsp;&nbsp;<h4 id="numberOfInventory" style="display:inline;">()</h4>
                    <div id="nothinghere"><br><br><h4>There's nothing here</h4><br></div>
                <table id="theHeadersOfTheTable" class="table">
                    <thead>
                        <th scope="col">Name</th>
                        <th scope="col">Inventory</th>
                        <th scope="col" onclick="sort()">Expiration Date</th>
                    </thead>
                    <tbody id="databaseTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>

        function goToLink(input){
            window.location.replace(input+".html");
        }

        function debugReset() {
            localStorage.setItem("2027_EMR", JSON.stringify({"batches":[]}))
        }

        function autoRun(){
            let rwa = localStorage.getItem("2027_EMR")

            if (!rwa){
                try {
                    console.log("Data doesn't exist lmao, trying to create it...")
                    debugReset()
                    console.log("Data now created...")
                    return;
                } catch (error) {
                    console.log("But something went wrong...")
                }
            }

            try {
                console.log("Checking if Data is looking good...")
                JSON.parse(rwa)
                console.log("Awesome...")
                return;

            } catch (error) {
                if (error instanceof SyntaxError) {
                    console.error("Data got corrupted aw man... ", error.message);
                } else {
                    console.error("Something really unexpected happened: ", error);
                }

                debugReset()
            }
        }

        function autoRun_sort(){
            let sortPref = localStorage.getItem("2027_EMR_sortpref")
            let error = false
            if (sortPref != null){
                switch(sortPref){
                    case "date":
                        sort()
                    break
                    default:
                        error = true
                }
            }else{
                error = true
            }

            if (error == true){
                console.log("no exist")
                localStorage.setItem("2027_EMR_sortpref", "date")
                sort()
            }
        }

        autoRun()

        let database = JSON.parse(localStorage.getItem("2027_EMR"))

        autoRun_sort()

        function view() {
            $("#databaseTable").empty()
            databaseTable = $("#databaseTable")

            if (database.batches.length > 0){
                try{document.getElementById("nothinghere").remove();}catch (error){}
                for (let i = 0; i < database.batches.length; i++) {
                    let batch = database.batches[i]
                    databaseTable.append(`<tr><th scope="row"><a href="update_delete.html?id=${i}" class="btn btn-light" role="button">${batch.name}</a></th><td>${batch.start+batch.added-batch.consumed}</td><td>${batch.expiryA}</td></tr>`)
                }

                document.getElementById("numberOfInventory").textContent = "("+database.batches.length+")";

            }else{
                try{$(theHeadersOfTheTable).remove()
                document.getElementById("numberOfInventory").remove();}catch (error){}
            }
        }
        view()

        //DATE SORT/DEFAULT SORT
        //CURRENTLY IN INSERTION SORT, PLS FIX
        function sort(){
            console.log(database)

            for (let i = 1; i<database.batches.length;i+=1){
                for(let j=i;j!=0;j-=1){
                    const date_a = new Date(database.batches[j-1].expiryA)
                    const date_b = new Date(database.batches[j].expiryA)

                    if(date_a > date_b){
                        [database.batches[j-1], database.batches[j]] = [database.batches[j],database.batches[j-1]]
                    }else{
                        break
                    }
                }
            }
                
            localStorage.setItem("2027_EMR", JSON.stringify(database))
            return database
        }

        function unsort(iters){
            for (let _ = 0; _<iters;_++){
                for (let i = 1; i<database.batches.length;i+=1){
                    if (Math.random() - 0.5>=0){
                        [database.batches[i-1], database.batches[i]] = [database.batches[i],database.batches[i-1]]
                        console.log("swap")
                    }
                }
            }
            localStorage.setItem("2027_EMR", JSON.stringify(database))
        }
        setInterval(view, 2763)
    </script>
</body>
</html>
